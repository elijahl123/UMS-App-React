name: ums-app-react

services:
  api:
    image: ${API_IMAGE:-ghcr.io/elijahl123/ums-app-react-api}:${RELEASE_TAG:-latest}
    env_file:
      - ${UMS_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      PORT: "3001"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - app

  web:
    image: ${WEB_IMAGE:-ghcr.io/elijahl123/ums-app-react-web}:${RELEASE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      - app

  migrate:
    image: ${API_IMAGE:-ghcr.io/elijahl123/ums-app-react-api}:${RELEASE_TAG:-latest}
    profiles:
      - tools
    env_file:
      - ${UMS_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
    command:
      - node
      - dist-server/migrate.js
    init: true
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
