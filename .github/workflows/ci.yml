name: CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check end-to-end tests
        run: npm run typecheck:e2e

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
